<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FinTrack MX</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ── DESIGN TOKENS ── */
:root{
  --bg:#dde8e4;
  --surface:#ffffff;
  --surface-2:#f2f8f5;
  --primary:#1a5e44;
  --accent:#5fb898;
  --text-1:#0d2218;
  --text-2:#3d6050;
  --text-3:#4a6a5c;
  --income:#168a56;
  --income-bg:#e5f7ee;
  --expense:#c53030;
  --expense-bg:#fde8e8;

  /* Clay shadow system */
  --clay-lg:8px 14px 32px rgba(0,55,32,0.14),-5px -5px 16px rgba(255,255,255,0.94);
  --clay-md:5px 8px 18px rgba(0,55,32,0.11),-3px -3px 10px rgba(255,255,255,0.90);
  --clay-sm:3px 4px 10px rgba(0,55,32,0.09),-2px -2px 6px rgba(255,255,255,0.86);
  --clay-in:inset 3px 3px 8px rgba(0,55,32,0.10),inset -2px -2px 6px rgba(255,255,255,0.84);

  --ease-out:cubic-bezier(0.22,1,0.36,1);
}

/* ── BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'DM Sans',sans-serif;
  min-height:100dvh;
  background:var(--bg);
  overflow-x:hidden;
  padding-bottom:36px;
}
/* Telegram constrains this to phone width natively; the GitHub Pages
   link is also opened directly in a normal browser, so cap it there. */
.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100dvh}

/* ── HERO ── */
.hero{
  position:relative;
  width:100%;height:240px;
  overflow:hidden;flex-shrink:0;
}
.hero-sky{
  position:absolute;inset:0;
  background:radial-gradient(140% 120% at 88% 102%,#7fae9c 0%,#2e6f54 45%,#123f2d 100%);
}
.hero-fade{
  position:absolute;bottom:0;left:0;right:0;height:120px;
  background:linear-gradient(180deg,transparent 0%,var(--bg) 100%);
}
.hero-brand{position:absolute;top:32px;left:20px}
.hero-brand-small{
  font-size:10px;color:rgba(255,255,255,0.78);
  letter-spacing:0.12em;text-transform:uppercase;
  margin-bottom:5px;font-weight:600;
}
.hero-brand-big{
  font-family:'Playfair Display',serif;
  font-size:25px;font-weight:700;line-height:1;
  letter-spacing:-0.01em;
  color:#fff;
}
.hero-brand-big span{color:#bfe3d1}

/* ── BALANCE CARD ── */
.main-card{
  margin:0 16px;
  background:var(--surface);
  border-radius:28px;
  padding:22px 20px 20px;
  position:relative;z-index:2;
  margin-top:-54px;
  box-shadow:var(--clay-lg);
}
.mc-label{
  font-size:10px;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.10em;
  margin-bottom:6px;font-weight:600;
}
.mc-balance{
  font-family:'Playfair Display',serif;
  font-size:42px;font-weight:700;
  color:var(--text-1);
  letter-spacing:-1.5px;line-height:1;
  margin-bottom:18px;
  font-variant-numeric:tabular-nums;
}
.mc-balance.neg{color:var(--expense)}
.mc-balance.pos{color:var(--income)}

.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{
  background:var(--surface-2);
  border-radius:18px;padding:12px 14px;
  box-shadow:var(--clay-sm);
}
.stat-lbl{
  font-size:9px;color:var(--text-3);
  margin-bottom:4px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;
}
.stat-val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-val.income{color:var(--income)}
.stat-val.expense{color:var(--expense)}

#month-label{font-size:11px;color:var(--text-3);text-align:center;font-weight:500}

/* ── PRIMARY BUTTON ── */
.action-btn{
  width:100%;padding:14px;
  background:var(--primary);
  color:#fff;font-size:14px;font-weight:600;
  border:none;border-radius:16px;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  box-shadow:5px 7px 20px rgba(26,94,68,0.32),
             -2px -2px 8px rgba(255,255,255,0.45);
  transition:transform 0.12s ease,box-shadow 0.12s ease;
  touch-action:manipulation;
}
.action-btn:active{
  transform:scale(0.97);
  box-shadow:2px 3px 10px rgba(26,94,68,0.20);
}
.action-btn:disabled{
  opacity:0.6;cursor:not-allowed;
  transform:none;
}

/* ── TABS ── */
.tabs-row{
  display:flex;
  margin:18px 16px 0;
  background:rgba(0,0,0,0.07);
  border-radius:18px;padding:4px;
  gap:4px;
}
.tab{
  flex:1;min-height:44px;padding:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:500;
  font-family:'DM Sans',sans-serif;
  border:none;background:transparent;
  color:var(--text-3);
  border-radius:14px;cursor:pointer;
  transition:all 0.20s ease;
  touch-action:manipulation;
}
.tab.active{
  background:var(--surface);
  color:var(--primary);
  font-weight:700;
  box-shadow:var(--clay-sm);
}

/* ── CONTENT ── */
.content{padding:14px 16px 0}
.section{display:none}.section.active{display:block}

/* ── ADD FORM ── */
.form-wrap{
  background:var(--surface);
  border-radius:26px;
  padding:22px 20px;
  box-shadow:var(--clay-lg);
}
.form-title{
  font-family:'Playfair Display',serif;
  font-size:22px;font-weight:700;
  color:var(--text-1);margin-bottom:3px;
}
.form-sub{font-size:12px;color:var(--text-3);margin-bottom:20px;font-weight:500}

.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.type-btn{
  min-height:44px;padding:12px;font-size:13px;font-weight:600;
  border:none;
  border-radius:14px;cursor:pointer;
  background:var(--surface-2);
  color:var(--text-3);
  transition:all 0.18s ease;
  font-family:'DM Sans',sans-serif;
  box-shadow:var(--clay-sm);
  touch-action:manipulation;
}
.type-btn.expense.active{
  background:var(--expense-bg);
  color:var(--expense);
  box-shadow:var(--clay-md);
}
.type-btn.income.active{
  background:var(--income-bg);
  color:var(--income);
  box-shadow:var(--clay-md);
}

.field-label{
  font-size:9px;color:var(--text-3);
  margin-bottom:6px;display:block;
  text-transform:uppercase;letter-spacing:0.09em;font-weight:700;
}
.field-group{margin-bottom:14px}

input,select{
  width:100%;padding:13px 15px;font-size:16px;
  border:none;border-radius:14px;
  background:var(--surface-2);
  color:var(--text-1);outline:none;
  -webkit-appearance:none;appearance:none;
  font-family:'DM Sans',sans-serif;
  box-shadow:var(--clay-in);
  transition:box-shadow 0.18s;
}
input:focus,select:focus{
  box-shadow:var(--clay-in),0 0 0 2.5px rgba(95,184,152,0.40);
}
input::placeholder{color:var(--text-3);font-weight:400}

.or-row{
  display:flex;align-items:center;gap:10px;
  margin:16px 0 12px;
}
.or-line{flex:1;height:1px;background:rgba(0,0,0,0.07)}
.or-text{font-size:11px;color:var(--text-3);font-weight:500}

/* ── HISTORY ── */
.filter-row{display:flex;gap:7px;margin-bottom:14px}
.fchip{
  font-size:11px;padding:7px 16px;
  border:none;border-radius:20px;
  background:var(--surface);
  color:var(--text-2);cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:all 0.18s ease;
  box-shadow:var(--clay-sm);
  font-weight:600;
  touch-action:manipulation;
}
.fchip.active{
  background:var(--primary);
  color:#fff;
  box-shadow:4px 5px 14px rgba(26,94,68,0.28),
             -2px -2px 7px rgba(255,255,255,0.38);
}

.tx-list{display:flex;flex-direction:column;gap:9px}
.tx{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:var(--surface);
  border-radius:20px;
  box-shadow:var(--clay-md);
}
.tx-ico{
  width:42px;height:42px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);flex-shrink:0;
  box-shadow:var(--clay-sm);
  color:var(--primary);
}
.tx-ico svg{width:20px;height:20px}
.tx-inf{flex:1;min-width:0}
.tx-name{
  font-size:13px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-1);
}
.tx-meta{font-size:11px;color:var(--text-3);margin-top:2px;font-weight:500}
.tx-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.tx-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.tx-amt.income{color:var(--income)}
.tx-amt.expense{color:var(--expense)}
.tx-del{
  background:none;border:none;
  color:var(--text-3);cursor:pointer;
  font-size:13px;padding:15px;margin:-15px;line-height:1;
  border-radius:10px;
  transition:color 0.15s var(--ease-out),background 0.15s var(--ease-out);
  touch-action:manipulation;
}
.tx-del:active{color:var(--expense);background:var(--expense-bg)}

/* ── STATS ── */
.stat-block{
  background:var(--surface);
  border-radius:22px;
  padding:18px 20px;
  box-shadow:var(--clay-md);
  margin-bottom:12px;
}
.sb-title{
  font-size:9px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:0.09em;margin-bottom:16px;
}
.cat-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cat-row:last-child{margin-bottom:0}
.cat-ico{width:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.cat-ico svg{width:16px;height:16px}
.cat-name{
  font-size:12px;font-weight:600;
  width:72px;flex-shrink:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-1);
}
.cat-bar-bg{
  flex:1;height:6px;
  background:rgba(0,0,0,0.06);
  border-radius:6px;overflow:hidden;
}
.cat-bar{
  width:100%;height:100%;border-radius:6px;
  transform-origin:left;
  transition:transform 0.5s var(--ease-out);
}
.cat-amt{
  font-size:11px;color:var(--text-2);
  min-width:60px;text-align:right;flex-shrink:0;
  font-variant-numeric:tabular-nums;font-weight:500;
}

/* ── MONTHLY TABLE ── */
.balance-card{
  background:var(--surface);border-radius:22px;padding:18px 20px;
  box-shadow:var(--clay-md);margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.balance-card-lbl{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px}
.balance-card-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--text-1);font-variant-numeric:tabular-nums}
.balance-edit-btn{
  background:var(--surface-2);border:none;border-radius:12px;
  padding:10px 16px;font-size:12px;font-weight:600;color:var(--primary);
  cursor:pointer;touch-action:manipulation;font-family:'DM Sans',sans-serif;
  min-height:44px;flex-shrink:0;
}
.balance-edit-row{display:flex;gap:8px;align-items:center;flex:1}
.balance-edit-row input{width:auto;flex:1}

.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{
  width:44px;height:44px;border-radius:14px;border:none;
  background:var(--surface);box-shadow:var(--clay-sm);
  color:var(--primary);font-size:18px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  flex-shrink:0;
}
.cal-nav-label{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text-1)}

.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:52px;gap:5px;margin-bottom:14px;width:100%}
.cal-dow{font-size:9px;font-weight:700;color:var(--text-3);text-align:center;text-transform:uppercase;padding-bottom:2px;min-width:0}
.cal-cell{
  min-width:0;border-radius:12px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;touch-action:manipulation;box-shadow:var(--clay-sm);
  transition:background 0.15s var(--ease-out);
  overflow:hidden;
}
.cal-cell.empty{background:transparent;box-shadow:none;cursor:default}
.cal-cell.today{box-shadow:0 0 0 2px var(--primary) inset,var(--clay-sm)}
.cal-cell.selected{background:var(--primary)}
.cal-cell.selected .cal-day-num,.cal-cell.selected .cal-day-amt.expense,.cal-cell.selected .cal-day-amt.income{color:#fff}
.cal-day-num{font-size:13px;font-weight:700;color:var(--text-1)}
.cal-day-amt{font-size:8px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-day-amt.expense{color:var(--expense)}
.cal-day-amt.income{color:var(--income)}

.day-detail-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;font-size:12px;
  border-top:1px solid rgba(0,0,0,0.05);
}
.day-detail-row .cat-ico{width:18px;color:var(--text-2)}
.day-detail-row .cat-ico svg{width:14px;height:14px}
.day-detail-name{flex:1;color:var(--text-2);font-weight:500}
.day-detail-amt{font-variant-numeric:tabular-nums;font-weight:600}

/* ── EMPTY ── */
.empty{text-align:center;padding:44px 0;color:var(--text-3)}
.empty-ico{margin-bottom:10px}
.empty-ico svg{width:36px;height:36px}
.empty-txt{font-size:13px;font-weight:600}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--text-1);color:#a8d4c0;
  padding:11px 24px;border-radius:24px;
  font-size:12px;font-weight:700;
  box-shadow:var(--clay-md);
  transition:transform 0.25s var(--ease-out);
  z-index:200;white-space:nowrap;pointer-events:none;
  letter-spacing:0.01em;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.with-action{
  pointer-events:auto;
  display:flex;align-items:center;gap:14px;
  padding-right:14px;
}
.toast-undo{
  background:none;border:none;
  color:#bfe3d1;font-weight:700;font-size:12px;
  font-family:'DM Sans',sans-serif;
  letter-spacing:0.01em;cursor:pointer;
  padding:6px 2px;touch-action:manipulation;
}

/* ── REDUCED MOTION ── */
@media (prefers-reduced-motion:reduce){
  .action-btn,.tab,.fchip,.type-btn,.cat-bar,.toast,.cal-cell{transition:none}
  .action-btn:active{transform:none}
}
</style>
</head>
<body>
<div class="app">

<!-- HERO -->
<div class="hero">
  <div class="hero-sky"></div>
  <div class="hero-fade"></div>
  <div class="hero-brand">
    <div class="hero-brand-small">Личные финансы</div>
    <div class="hero-brand-big">FinTrack <span>MX</span></div>
  </div>
</div>

<!-- BALANCE CARD -->
<div class="main-card">
  <div class="mc-label">Текущий баланс</div>
  <div class="mc-balance" id="balance-display">0 сум</div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-lbl">Доходы</div>
      <div class="stat-val income" id="total-income">0 сум</div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Расходы</div>
      <div class="stat-val expense" id="total-expense">0 сум</div>
    </div>
  </div>
  <div id="month-label"></div>
</div>

<!-- TABS -->
<div class="tabs-row">
  <button class="tab active" data-tab="add">Добавить</button>
  <button class="tab" data-tab="history">История</button>
  <button class="tab" data-tab="stats">Статистика</button>
  <button class="tab" data-tab="table">Таблица</button>
</div>

<!-- CONTENT -->
<div class="content">

  <!-- ADD -->
  <div class="section active" id="tab-add">
    <div class="form-wrap">
      <div class="form-title">Новая запись</div>
      <div class="form-sub">Добавьте доход или расход</div>

      <div class="type-toggle">
        <button class="type-btn expense active" id="btn-expense">Расход</button>
        <button class="type-btn income" id="btn-income">Доход</button>
      </div>

      <div class="field-group">
        <label class="field-label" for="inp-amount">Сумма (сум)</label>
        <input type="text" id="inp-amount" placeholder="0" inputmode="numeric" autocomplete="off"/>
      </div>
      <div class="field-group">
        <label class="field-label" for="inp-name">Название</label>
        <input type="text" id="inp-name" placeholder="Например: Продукты" maxlength="50"/>
      </div>
      <div class="field-group">
        <label class="field-label" for="inp-cat">Категория</label>
        <select id="inp-cat"></select>
      </div>

      <button class="action-btn" id="add-btn">Добавить запись</button>

      <div class="or-row">
        <div class="or-line"></div>
        <div class="or-text">или</div>
        <div class="or-line"></div>
      </div>
      <div style="font-size:12px;color:var(--text-3);text-align:center;font-weight:500">
        Перейдите в <span style="color:var(--primary);font-weight:700;cursor:pointer" onclick="switchTo('history')">Историю</span> для управления записями
      </div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="section" id="tab-history">
    <div class="filter-row">
      <button class="fchip active" data-filter="all">Все</button>
      <button class="fchip" data-filter="income">Доходы</button>
      <button class="fchip" data-filter="expense">Расходы</button>
    </div>
    <div class="tx-list" id="tx-list"></div>
  </div>

  <!-- STATS -->
  <div class="section" id="tab-stats">
    <div id="stats-content"></div>
  </div>

  <!-- MONTHLY TABLE -->
  <div class="section" id="tab-table">
    <div id="table-content"></div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

</div>

const EMPTY_ICO_HISTORY=SVG_OPEN+'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z"/><path d="M9 11h6M9 14h6M9 17h3"/></svg>';

const BARS=['#1a5e44','#3da678','#5bbf96','#c9974a','#a65a3f','#6b8f7a','#3d8a99'];

let cType='expense',cFilter='all';

/* ── SUPABASE HELPERS ── */
async function sbReq(path,opts={}){
  const res=await fetch(SB_URL+path,{
    ...opts,
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=representation',
      ...(opts.headers||{})
    }
  });
  if(!res.ok)throw new Error('SB '+res.status);
  const text=await res.text();
  return text?JSON.parse(text):[];
}

async function getData(){
  if(!USER_ID)return[];
  try{
    const rows=await sbReq(`/rest/v1/transactions?user_id=eq.${USER_ID}&order=created_at.desc`);
    return rows.map(r=>({
      id:r.id,
      type:r.type,
      amount:parseFloat(r.amount),
      name:r.name,
      cat:r.category,
      ts:new Date(r.created_at),
      date:new Date(r.created_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'})
    }));
  }catch(e){console.error(e);return[];}
}

async function addTx(tx){
  await sbReq('/rest/v1/transactions',{
    method:'POST',
    body:JSON.stringify({user_id:USER_ID,type:tx.type,amount:tx.amount,name:tx.name,category:tx.cat})
  });
}

async function deleteTx(id){
  await sbReq(`/rest/v1/transactions?id=eq.${id}&user_id=eq.${USER_ID}`,{method:'DELETE',headers:{'Prefer':''}});
}

/* ── MONTHLY BALANCE (cached per viewed month) ── */
let monthlyBalanceCache={};

async function getMonthlyBalanceFor(key){
  if(key in monthlyBalanceCache)return monthlyBalanceCache[key];
  if(!USER_ID){monthlyBalanceCache[key]=null;return null}
  try{
    const rows=await sbReq(`/rest/v1/monthly_balance?user_id=eq.${USER_ID}&year_month=eq.${key}`);
    monthlyBalanceCache[key]=rows[0]||null;
  }catch(e){monthlyBalanceCache[key]=null}
  return monthlyBalanceCache[key];
}

async function saveMonthlyBalance(key,value){
  await sbReq('/rest/v1/monthly_balance?on_conflict=user_id,year_month',{
    method:'POST',
    headers:{'Prefer':'resolution=merge-duplicates,return=representation'},
    body:JSON.stringify({user_id:USER_ID,year_month:key,starting_balance:value})
  });
  monthlyBalanceCache[key]={starting_balance:value};
}

/* ── UTILS ── */
function fmt(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n))+' сум'}
function fmtShort(n){
  const a=Math.abs(n);
  if(a>=1000000)return (n/1000000).toFixed(Math.round(a)%1000000===0?0:1)+'M';
  if(a>=1000)return Math.round(n/1000)+'K';
  return String(Math.round(n));
}

function showToast(msg){
  const el=document.getElementById('toast');
  el.classList.remove('with-action');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2200);
}

function showUndoToast(msg,onUndo){
  const el=document.getElementById('toast');
  el.classList.add('with-action');
  el.innerHTML='';
  const span=document.createElement('span');span.textContent=msg;
  const btn=document.createElement('button');btn.className='toast-undo';btn.type='button';btn.textContent='Отменить';
  el.append(span,btn);
  el.classList.add('show');
  clearTimeout(el._t);
  btn.onclick=()=>{onUndo();el.classList.remove('show');clearTimeout(el._t)};
  el._t=setTimeout(()=>{el.classList.remove('show');el.classList.remove('with-action')},3800);
}

const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const now=new Date();
document.getElementById('month-label').textContent=months[now.getMonth()]+' '+now.getFullYear();

function fillCats(){
  const sel=document.getElementById('inp-cat');
  sel.innerHTML=CATS[cType].map(c=>`<option>${c}</option>`).join('');
}

function setType(t){
  cType=t;
  document.getElementById('btn-expense').classList.toggle('active',t==='expense');
  document.getElementById('btn-income').classList.toggle('active',t==='income');
  fillCats();
}
document.getElementById('btn-expense').onclick=()=>setType('expense');
document.getElementById('btn-income').onclick=()=>setType('income');

/* ── AMOUNT INPUT: live "1.000.000" grouping while typing ── */
const inpAmount=document.getElementById('inp-amount');
inpAmount.addEventListener('input',()=>{
  const digits=inpAmount.value.replace(/\D/g,'').slice(0,12);
  inpAmount.value=digits?Number(digits).toLocaleString('en-US').replace(/,/g,'.'):'';
});

/* ── ADD HANDLER ── */
document.getElementById('add-btn').onclick=async()=>{
  const amount=parseFloat(inpAmount.value.replace(/\./g,''));
  const name=document.getElementById('inp-name').value.trim();
  const cat=document.getElementById('inp-cat').value;
  if(!amount||amount<=0){showToast('Введите сумму');return}
  if(!name){showToast('Введите название');return}
  if(!USER_ID){showToast('Откройте через Telegram бот');return}
  const btn=document.getElementById('add-btn');
  btn.disabled=true;btn.textContent='Сохранение...';
  try{
    await addTx({type:cType,amount,name,cat});
    document.getElementById('inp-amount').value='';
    document.getElementById('inp-name').value='';
    await updateAll();
    showToast(cType==='income'?'Доход добавлен ✓':'Расход добавлен ✓');
    if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');
  }catch(e){showToast('Ошибка сохранения');}
  finally{btn.disabled=false;btn.textContent='Добавить запись';}
};

/* ── TABS ── */
function switchTo(tab){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  updateAll();
}
document.querySelectorAll('.tab').forEach(btn=>{btn.onclick=()=>switchTo(btn.dataset.tab)});

document.querySelectorAll('.fchip').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');cFilter=btn.dataset.filter;updateAll();
  };
});

/* ── RENDER ── */
function updateSummary(data){
  const income=data.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense=data.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const bal=income-expense;
  const bd=document.getElementById('balance-display');
  bd.textContent=fmt(bal);
  bd.className='mc-balance'+(bal<0?' neg':bal>0?' pos':'');
  document.getElementById('total-income').textContent=fmt(income);
  document.getElementById('total-expense').textContent=fmt(expense);
}

function renderHistory(data){
  const filtered=data.filter(t=>(cFilter==='all'||t.type===cFilter)&&!(pendingDelete&&pendingDelete.id===t.id));
  const list=document.getElementById('tx-list');
  if(!filtered.length){
    list.innerHTML=`<div class="empty"><div class="empty-ico">${EMPTY_ICO_HISTORY}</div><div class="empty-txt">Записей пока нет</div></div>`;
    return;
  }
  list.innerHTML=filtered.map(t=>`
    <div class="tx">
      <div class="tx-ico">${ICON_SVG[t.cat]||ICON_SVG['Другое']}</div>
      <div class="tx-inf">
        <div class="tx-name">${t.name}</div>
        <div class="tx-meta">${t.cat} · ${t.date}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amt ${t.type}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</div>
        <button class="tx-del" data-id="${t.id}" aria-label="Удалить запись">✕</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.tx-del').forEach(b=>{
    b.onclick=()=>scheduleDelete(parseInt(b.dataset.id));
  });
}

/* ── DELETE WITH UNDO ──
   Deletes immediately (fire the real request right away) instead of
   waiting out an undo window before committing: Telegram's WebView can
   suspend/background the Mini App the moment a user taps away, and a
   delayed setTimeout-based commit may simply never run, leaving the
   record undeleted. Undo re-creates the transaction instead of
   cancelling a pending timer, so it stays correct regardless of when
   (or whether) the app is still open. */
let pendingDelete=null; // {id} — only used to optimistically hide the row

function refreshAfterLocalChange(){
  const visible=pendingDelete?lastData.filter(t=>t.id!==pendingDelete.id):lastData;
  renderHistory(lastData);
  updateSummary(visible);
  renderStats(visible);
  renderTable(lastData);
}

function scheduleDelete(id){
  const tx=lastData.find(t=>t.id===id);
  if(!tx)return;
  pendingDelete={id};
  refreshAfterLocalChange();

  deleteTx(id).catch(()=>{
    pendingDelete=null;
    refreshAfterLocalChange();
    showToast('Ошибка удаления');
  });

  showUndoToast('Запись удалена',async()=>{
    pendingDelete=null;
    refreshAfterLocalChange();
    try{await addTx({type:tx.type,amount:tx.amount,name:tx.name,cat:tx.cat})}catch(e){}
    await updateAll();
  });
}

function renderStats(data){
  const expenses=data.filter(t=>t.type==='expense');
  const c=document.getElementById('stats-content');
  if(!expenses.length){
    c.innerHTML=`<div class="empty"><div class="empty-ico">${EMPTY_ICO_STATS}</div><div class="empty-txt">Нет расходов для анализа</div></div>`;
    return;
  }
  const byCat={};
  expenses.forEach(t=>{byCat[t.cat]=(byCat[t.cat]||0)+t.amount});
  const sorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0][1];
  const total=sorted.reduce((s,[,v])=>s+v,0);
  c.innerHTML=`
    <div class="stat-block">
      <div class="sb-title">Расходы по категориям</div>
      ${sorted.map(([cat,amt],i)=>`
        <div class="cat-row">
          <div class="cat-ico">${ICON_SVG[cat]||ICON_SVG['Другое']}</div>
          <div class="cat-name">${cat}</div>
          <div class="cat-bar-bg"><div class="cat-bar" style="transform:scaleX(${(amt/max).toFixed(4)});background:${BARS[i%BARS.length]}"></div></div>
          <div class="cat-amt">${fmt(amt)}</div>
        </div>
      `).join('')}
    </div>
    <div class="stat-block">
      <div class="sb-title">Итого расходов</div>
      <div style="font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--expense);font-variant-numeric:tabular-nums">${fmt(total)}</div>
    </div>
  `;
}

let lastData=[];

const MONTHS_SHORT=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

let viewYear=new Date().getFullYear(),viewMonth=new Date().getMonth();
let selectedDay=null;

async function renderTable(data){
  const c=document.getElementById('table-content');
  const y=viewYear,m=viewMonth;
  const key=y+'-'+String(m+1).padStart(2,'0');
  const monthTx=data.filter(t=>t.ts.getFullYear()===y&&t.ts.getMonth()===m&&!(pendingDelete&&pendingDelete.id===t.id));
  const mb=await getMonthlyBalanceFor(key);
  const daysInMonth=new Date(y,m+1,0).getDate();
  const start=mb?parseFloat(mb.starting_balance):0;

  let running=start;
  const dayInfo={};
  for(let day=1;day<=daysInMonth;day++){
    const dayTx=monthTx.filter(t=>t.ts.getDate()===day);
    const dayExpense=dayTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const dayIncome=dayTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    running+=dayIncome-dayExpense;
    dayInfo[day]={dayTx,dayExpense,dayIncome,pocket:running};
  }

  const catTotals={};
  let monthExpenseTotal=0;
  monthTx.filter(t=>t.type==='expense').forEach(t=>{catTotals[t.cat]=(catTotals[t.cat]||0)+t.amount;monthExpenseTotal+=t.amount});
  const monthIncomeTotal=monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const catSorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const catMax=catSorted.length?catSorted[0][1]:1;

  const balanceCardHtml=`
    <div class="balance-card" id="balance-card">
      <div>
        <div class="balance-card-lbl">Баланс на начало месяца</div>
        <div class="balance-card-val">${mb?fmt(start):'Не задан'}</div>
      </div>
      <button class="balance-edit-btn" id="balance-edit-btn" type="button">${mb?'Изменить':'Задать'}</button>
    </div>`;

  const navHtml=`
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev" type="button" aria-label="Предыдущий месяц">‹</button>
      <div class="cal-nav-label">${months[m]} ${y}</div>
      <button class="cal-nav-btn" id="cal-next" type="button" aria-label="Следующий месяц">›</button>
    </div>`;

  const today=new Date();
  const isCurrentMonth=y===today.getFullYear()&&m===today.getMonth();
  const todayNum=today.getDate();
  const firstDow=(new Date(y,m,1).getDay()+6)%7;

  let cellsHtml=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++)cellsHtml+='<div class="cal-cell empty"></div>';
  for(let day=1;day<=daysInMonth;day++){
    const info=dayInfo[day];
    const net=info.dayIncome-info.dayExpense;
    const amtHtml=net!==0?`<div class="cal-day-amt ${net>0?'income':'expense'}">${net>0?'+':'−'}${fmtShort(Math.abs(net))}</div>`:'';
    const cls=['cal-cell'];
    if(isCurrentMonth&&day===todayNum)cls.push('today');
    if(selectedDay===day)cls.push('selected');
    cellsHtml+=`<div class="${cls.join(' ')}" data-day="${day}">
      <div class="cal-day-num">${day}</div>
      ${amtHtml}
    </div>`;
  }

  let detailHtml='';
  if(selectedDay&&dayInfo[selectedDay]){
    const info=dayInfo[selectedDay];
    const rowsHtml=info.dayTx.length?info.dayTx.map(t=>`
      <div class="day-detail-row">
        <div class="cat-ico">${ICON_SVG[t.cat]||ICON_SVG['Другое']}</div>
        <div class="day-detail-name">${t.name}</div>
        <div class="day-detail-amt" style="color:${t.type==='income'?'var(--income)':'var(--expense)'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</div>
        <button class="tx-del" data-id="${t.id}" aria-label="Удалить запись">✕</button>
      </div>`).join(''):'<div class="day-detail-row"><div class="day-detail-name" style="color:var(--text-3)">Нет записей</div></div>';
    detailHtml=`
      <div class="stat-block">
        <div class="sb-title">${selectedDay} ${MONTHS_SHORT[m]} · В кармане: ${fmt(info.pocket)}</div>
        ${rowsHtml}
      </div>`;
  }

  c.innerHTML=balanceCardHtml+navHtml+`<div class="cal-grid">${cellsHtml}</div>`+detailHtml+`
    <div class="stat-block">
      <div class="sb-title">Расходы за месяц по категориям</div>
      ${catSorted.length?catSorted.map(([cat,amt],i)=>`
        <div class="cat-row">
          <div class="cat-ico">${ICON_SVG[cat]||ICON_SVG['Другое']}</div>
          <div class="cat-name">${cat}</div>
          <div class="cat-bar-bg"><div class="cat-bar" style="transform:scaleX(${(amt/catMax).toFixed(4)});background:${BARS[i%BARS.length]}"></div></div>
          <div class="cat-amt">${fmt(amt)} · ${monthExpenseTotal?Math.round(amt/monthExpenseTotal*100):0}%</div>
        </div>`).join(''):'<div class="empty-txt" style="color:var(--text-3);font-weight:500">Нет расходов в этом месяце</div>'}
    </div>
    <div class="stat-block">
      <div class="sb-title">Итого за месяц</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;font-weight:600;color:var(--income)">Доход</div>
        <div style="font-size:15px;font-weight:700;color:var(--income);font-variant-numeric:tabular-nums">${fmt(monthIncomeTotal)}</div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:13px;font-weight:600;color:var(--expense)">Расход</div>
        <div style="font-size:15px;font-weight:700;color:var(--expense);font-variant-numeric:tabular-nums">${fmt(monthExpenseTotal)}</div>
      </div>
    </div>`;

  document.getElementById('balance-edit-btn').onclick=()=>editBalance(key);
  document.getElementById('cal-prev').onclick=()=>{
    viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}
    selectedDay=null;renderTable(lastData);
  };
  document.getElementById('cal-next').onclick=()=>{
    viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}
    selectedDay=null;renderTable(lastData);
  };
  c.querySelectorAll('.cal-cell:not(.empty)').forEach(cell=>{
    cell.onclick=()=>{
      const day=parseInt(cell.dataset.day);
      selectedDay=selectedDay===day?null:day;
      renderTable(lastData);
    };
  });
  c.querySelectorAll('.day-detail-row .tx-del').forEach(b=>{
    b.onclick=()=>scheduleDelete(parseInt(b.dataset.id));
  });
}

function editBalance(key){
  const card=document.getElementById('balance-card');
  const mb=monthlyBalanceCache[key];
  const startVal=mb?Number(mb.starting_balance).toLocaleString('en-US').replace(/,/g,'.'):'';
  card.innerHTML=`<div class="balance-edit-row">
    <input type="text" id="balance-input" inputmode="numeric" placeholder="0" value="${startVal}"/>
    <button class="balance-edit-btn" id="balance-save-btn" type="button">Сохранить</button>
  </div>`;
  const inp=document.getElementById('balance-input');
  inp.focus();
  inp.addEventListener('input',()=>{
    const digits=inp.value.replace(/\D/g,'').slice(0,12);
    inp.value=digits?Number(digits).toLocaleString('en-US').replace(/,/g,'.'):'';
  });
  document.getElementById('balance-save-btn').onclick=async()=>{
    const val=parseFloat(inp.value.replace(/\./g,''));
    if(isNaN(val)){showToast('Введите число');return}
    const btn=document.getElementById('balance-save-btn');
    btn.disabled=true;btn.textContent='Сохранение...';
    try{
      await saveMonthlyBalance(key,val);
      await renderTable(lastData);
      showToast('Баланс сохранён ✓');
    }catch(e){showToast('Ошибка сохранения');btn.disabled=false;btn.textContent='Сохранить'}
  };
}

async function updateAll(){
  lastData=await getData();
  updateSummary(lastData);
  renderHistory(lastData);
  renderStats(lastData);
  await renderTable(lastData);
}

fillCats();updateAll();
</script>
